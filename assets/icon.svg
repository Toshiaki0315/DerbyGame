  <g fill="#14532d">
    <circle cx="300" cy="640" r="18"/><circle cx="318" cy="540" r="18"/><circle cx="372" cy="450" r="18"/>
    <circle cx="724" cy="640" r="18"/><circle cx="706" cy="540" r="18"/><circle cx="652" cy="450" r="18"/>
  </g>
  <!-- finish-line flag -->

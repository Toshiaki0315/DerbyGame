[package]
name = "derby-game"
version = "0.1.0"
description = "A horse racing simulation game"
authors = ["Toshiaki0315"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tauri = { version = "2.0.0", features = ["test"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
